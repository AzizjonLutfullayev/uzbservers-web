name: Update CS 1.6 server monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Query servers
        run: python3 monitor.py

      - name: Commit updated server data
        run: |
          git config user.name "uzbservers-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/servers.json
          git diff --cached --quiet || git commit -m "Update CS 1.6 server status"
          git push
